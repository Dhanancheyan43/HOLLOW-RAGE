<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }

  .tb { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 50%; font-size: 12px; font-weight: 700; }
  .tb.on { background: rgba(200,16,42,0.45); }
  .pad { width: 54px; height: 54px; border-radius: 12px; font-size: 18px; }
  .pad.l { left: 16px; bottom: 74px; } .pad.r { left: 128px; bottom: 74px; }
  .pad.u { left: 72px; bottom: 132px; } .pad.d { left: 72px; bottom: 16px; }
  .btn { width: 64px; height: 64px; }
  .btn.a { right: 16px; bottom: 30px; } .btn.b { right: 92px; bottom: 60px; }
  .btn.c { right: 30px; bottom: 108px; } .btn.e { right: 168px; bottom: 30px; }
  .btn.p { width: 40px; height: 40px; right: 16px; top: 16px; } .btn.m { width: 40px; height: 40px; right: 66px; top: 16px; font-size: 9px; }
</style>

</html>
